# The whole Orbitly stack: Postgres, the Spring Boot API and the Next.js web app.
#   docker compose up --build
#   then seed demo data:  docker compose run --rm seed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbitly
      POSTGRES_USER: orbitly
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orbitly}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitly"]
      interval: 5s
      retries: 20

  api:
    build: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/orbitly
      DB_USERNAME: orbitly
      DB_PASSWORD: ${DB_PASSWORD:-orbitly}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random value}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:3000}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_MODE: ${MAIL_MODE:-log}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
    volumes:
      - storage:/app/storage
    ports:
      - "8080:8080"

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"

  seed:
    image: node:22-alpine
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/scripts:/scripts:ro
    environment:
      API_URL: http://api:8080
      APP_URL: ${APP_URL:-http://localhost:3000}
    command: node /scripts/seed-demo.mjs

volumes:
  db:
  storage:
