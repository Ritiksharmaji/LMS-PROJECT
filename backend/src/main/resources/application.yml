spring:
  application:
    name: orbitly-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbitly}
    username: ${DB_USERNAME:${USER:postgres}}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

orbitly:
  app-url: ${APP_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Must be at least 32 bytes. Always override in non-local environments.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: orbitly
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  media:
    # "local" (disk, served by this API) or "s3" (AWS S3 / Cloudflare R2 / MinIO)
    storage: ${MEDIA_STORAGE:local}
    api-url: ${API_URL:http://localhost:8080}
    local:
      root: ${MEDIA_LOCAL_ROOT:./storage}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:auto}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
    mux:
      token-id: ${MUX_TOKEN_ID:}
      token-secret: ${MUX_TOKEN_SECRET:}
      webhook-secret: ${MUX_WEBHOOK_SECRET:}
      signing-key-id: ${MUX_SIGNING_KEY_ID:}
      signing-private-key: ${MUX_SIGNING_PRIVATE_KEY:}
  notifications:
    # "log" (print emails, for development) or "smtp"
    mail-mode: ${MAIL_MODE:log}
    from-address: ${MAIL_FROM:Orbitly <no-reply@orbitly.local>}
    reminders: true
  billing:
    # "test" (no real payments) or "stripe"
    provider: ${BILLING_PROVIDER:test}
    refund-window: 30d
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
